[package]
name = "lambda-parent"
version = "0.1.0"
edition = "2021"
# service-library and bee-rpc are GPL-3.0-only.
license = "GPL-3.0-only"
description = "The parent of lambda-service: runs a Python function in a MicroPython child service"

[dependencies]
# The tag of service-library, and the bee-rpc tag that it uses.
service-library = { git = "https://github.com/celaut-project/service-library", tag = "v0.9.0" }
celaut-proto = { git = "https://github.com/celaut-project/service-library", tag = "v0.9.0" }
bee-rpc = { git = "https://github.com/bee-rpc-protocol/bee-rpc-over-grpc-rs", tag = "v0.4.2" }
prost = "0.14"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util", "time"] }
tokio-stream = { version = "0.1", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
